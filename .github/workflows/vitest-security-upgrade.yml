name: Vitest security upgrade (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/vitest-security-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vitest-security-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-and-validate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/upgrade-vitest-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate lockfile (no force upgrades)
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Clean dependency install
        run: npm ci --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: Commit verified lockfile to PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh verified Vitest 5 lockfile'
          git push origin HEAD:security/upgrade-vitest-audit
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-upgrade-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 2
